<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إتمام الطلب</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>إتمام الطلب 🧾</h1>
</header>

<main class="cart">

<h2>ملخص الطلب</h2>

<div id="orderSummary"></div>

<h3 id="total">الإجمالي: 0 EGP</h3>

<hr>

<h2>بيانات العميل</h2>

<input id="name" placeholder="الاسم الكامل">
<input id="phone" placeholder="رقم الهاتف">
<input id="address" placeholder="العنوان الكامل">

<button onclick="placeOrder()">تأكيد الطلب</button>

</main>

<div id="successMsg" class="hidden">
    ✅ تم إرسال طلبك بنجاح! سنتواصل معك قريبًا
</div>

<script src="script.js"></script>

<script>
function loadOrder(){

    let box = document.getElementById("orderSummary");
    let total = 0;

    cart.forEach(item=>{
        total += item.price * item.quantity;

        box.innerHTML += `
        <p>
            ${item.name} × ${item.quantity} = ${item.price * item.quantity} EGP
        </p>
        `;
    });

    document.getElementById("total").innerText = "الإجمالي: " + total + " EGP";
}


    // رسالة نجاح
    document.getElementById("successMsg").classList.remove("hidden");

    // تفريغ السلة
    cart = [];
    localStorage.setItem("cart", JSON.stringify(cart));
    updateCartCount();

    setTimeout(()=>{
        window.location.href = "index.html";
    }, 3000);
}

loadOrder();
</script>

</body>
</html>
