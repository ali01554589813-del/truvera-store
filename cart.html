<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>السلة</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="toast"></div>

<header>
    <h1>السلة 🛒</h1>
    
<a href="cart.html">السلة 🛒 (<span id="cartCount">0</span>)</a>

</header>

<main class="cart">
    <div id="cartItems">لا توجد منتجات</div>
    <h3 id="total">الإجمالي: 0 EGP</h3>

    <button onclick="checkout()">إتمام الطلب</button>
</main>

<section id="checkoutBox" class="hidden">
    <input id="name" placeholder="الاسم">
    <input id="phone" placeholder="الهاتف">
    <button onclick="submitOrder()">تأكيد</button>
</section>

<div id="successMsg" class="hidden">
    تم إرسال الطلب بنجاح ✔
</div>

<a href="checkout.html">
    <button>إتمام الشراء</button>
</a>

<script src="script.js"></script>
</body>
</html>
